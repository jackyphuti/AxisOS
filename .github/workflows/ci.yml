name: AxisOS CI

on:
  push:
    branches: [ main, v2-development ]
  pull_request:
    branches: [ main ]

jobs:
  native-check:
    name: Native Subsystems & Build Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate Python Build Scripts
        run: |
          python3 -m py_compile os-build/scripts/*.py

      - name: Compile and Test axis-update
        working-directory: os-build/updater
        run: |
          make
          ./axis-update --help
          ./axis --help
          make clean
