name: AxisOS Pure C CI

on:
  push:
    branches: [ main, v2-development ]
  pull_request:
    branches: [ main ]

jobs:
  pure-c-check:
    name: Pure C11 Compilation & Linkage Verification
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Pure C Toolchain & Development Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc \
            pkg-config \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libvterm-dev \
            libarchive-dev \
            libjson-c-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libpam0g-dev \
            libudev-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libwlroots-dev \
            libinput-dev \
            libdrm-dev \
            libxkbcommon-dev

      - name: Verify Strict Zero C++ and Forbidden Language Policy
        run: |
          echo "Checking for prohibited files..."
          FORBIDDEN=$(find . -type f \( -name "*.c""pp" -o -name "*.h""pp" -o -name "*.q""ml" -o -name "*.p""y" \) -not -path "*/.git/*")
          if [ -n "$FORBIDDEN" ]; then
            echo "ERROR: Prohibited files detected:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "PASS: Zero prohibited files found."

      - name: Compile All Native Pure C Desktop Apps & Shell
        run: |
          chmod +x os-build/scripts/compile-native-apps.sh || true
          bash os-build/scripts/compile-native-apps.sh

      - name: Compile and Run Architecture Verification Suites
        run: |
          gcc -std=gnu11 -O2 tests/test_hardware_probe.c -o tests/test_hardware_probe
          ./tests/test_hardware_probe
          gcc -std=gnu11 -O2 tests/verify_harmony_ui.c -o tests/verify_harmony_ui
          ./tests/verify_harmony_ui

      - name: Verify Zero Prohibited Linkage Across All Binaries
        run: |
          chmod +x scripts/verify-pure-c.sh || true
          bash scripts/verify-pure-c.sh
