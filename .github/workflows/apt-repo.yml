name: "Publish AxisOS Remote APT Repository"

on:
  push:
    branches:
      - main
    paths:
      - 'shell-c/**'
      - 'os-build/apps/**'
      - 'os-build/scripts/**'
      - 'os-build/configs/**'
      - 'data/wallpapers/**'
      - 'data/branding/**'
      - 'data/theme/**'
      - '.github/workflows/apt-repo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build Debian Packages & APT Repository (Pure C)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Compile and Package inside Debian Container (Pure C11)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            debian:bookworm \
            bash -c "
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                gcc \
                pkg-config \
                libgtk-3-dev \
                libgtk-layer-shell-dev \
                libvterm-dev \
                libarchive-dev \
                libjson-c-dev \
                libcurl4-openssl-dev \
                libssl-dev \
                libudev-dev \
                libwayland-dev \
                libwayland-bin \
                wayland-protocols \
                libwlroots-dev \
                libinput-dev \
                libdrm-dev \
                libpam0g-dev \
                libxkbcommon-dev \
                libgl1-mesa-dev \
                libvulkan-dev \
                dpkg-dev \
                gzip \
                coreutils
              bash os-build/scripts/compile-native-apps.sh os-build/apps
              bash os-build/scripts/publish-apt-repo.sh
              chmod -R a+rw public_apt
            "

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_apt
          publish_branch: gh-pages
          keep_files: true
