name: "Publish AxisOS Remote APT Repository"

on:
  push:
    branches:
      - main
    paths:
      - 'os-build/apps/**'
      - 'os-build/scripts/**'
      - 'os-build/configs/apt/**'
      - '.github/workflows/apt-repo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build Debian Packages & APT Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Debian Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev build-essential libgtk-3-dev libudev-dev gzip coreutils

      - name: Compile Native Apps & Tools
        run: |
          bash os-build/scripts/compile-native-apps.sh os-build/apps

      - name: Build APT Repository Artifacts
        run: |
          bash os-build/scripts/publish-apt-repo.sh

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_apt
          publish_branch: gh-pages
          keep_files: true
