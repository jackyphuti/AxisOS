name: "Publish AxisOS Remote APT Repository"

on:
  push:
    branches:
      - main
    paths:
      - 'os-build/apps/**'
      - 'os-build/scripts/**'
      - 'os-build/configs/**'
      - 'data/wallpapers/**'
      - 'data/branding/**'
      - 'data/theme/**'
      - '.github/workflows/apt-repo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build Debian Packages & APT Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Compile and Package inside Debian Bookworm Container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            debian:bookworm \
            bash -c "
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                g++ \
                pkg-config \
                libgtk-3-dev \
                libudev-dev \
                dpkg-dev \
                gzip \
                coreutils
              bash os-build/scripts/compile-native-apps.sh os-build/apps
              bash os-build/scripts/publish-apt-repo.sh
              chmod -R a+rw public_apt
            "

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_apt
          publish_branch: gh-pages
          keep_files: true
