version: 2
updates:
  # Maintain npm dependencies in shell/
  - package-ecosystem: "npm"
    directory: "/shell"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "area: shell"

  # Maintain GitHub Actions in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "area: ci"
