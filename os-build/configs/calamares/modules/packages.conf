# AxisOS Packages Cleanup Module (Safe try_remove for offline installs)
---
backend: apt
skip_if_no_internet: false
update_db: false
update_system: false

operations:
  - try_remove:
      - 'live-boot'
      - 'live-boot-initramfs-tools'
      - 'live-config'
      - 'live-config-systemd'
      - 'live-tools'
      - 'calamares-settings-debian'
