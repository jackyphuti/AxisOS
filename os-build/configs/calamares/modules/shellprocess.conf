# AxisOS Post-Install Target System Cleanup (Fixes SDDM default session + cleans live artifacts)
---
dontChroot: false
timeout: 120
script:
    - "-rm -f /etc/sddm.conf.d/autologin.conf /etc/sddm.conf.d/sddm.conf"
    - "-rm -f /usr/share/wayland-sessions/axisos-gamemode.desktop /usr/share/wayland-sessions/liquidnodes.desktop"
    - "-systemctl disable seatd.service"
    - "-mkdir -p /var/lib/sddm"
    - "-sh -c 'U=$(ls -1 /home 2>/dev/null | grep -v \"^axis$\" | head -n1); printf \"[Last]\\nSession=/usr/share/xsessions/plasma.desktop\\nUser=%s\\n\" \"$U\" > /var/lib/sddm/state.conf && chown -R sddm:sddm /var/lib/sddm'"
    - "-rm -f /etc/skel/Desktop/install-axisos.desktop /etc/skel/Desktop/install-debian.desktop /etc/skel/Desktop/calamares.desktop"
    - "-rm -f /home/*/Desktop/install-axisos.desktop /home/*/Desktop/install-debian.desktop /home/*/Desktop/calamares.desktop"
    - "-rm -f /usr/share/applications/install-axisos.desktop /usr/share/applications/install-debian.desktop /usr/share/applications/calamares.desktop"
    - "-rm -f /etc/sudoers.d/axis"
    - "-sh -c 'if [ $(ls -1 /home 2>/dev/null | grep -v \"^axis$\" | wc -l) -gt 0 ]; then userdel -r axis 2>/dev/null || true; fi'"
    - "-sh -c 'for d in /home/*; do [ -d \"$d\" ] || continue; u=$(basename \"$d\"); id \"$u\" >/dev/null 2>&1 && chown -R \"$u:$u\" \"$d\"; done'"
    - "-systemctl enable axisos-ota.timer"
    - "-chown root:shadow /etc/shadow /etc/gshadow /usr/sbin/unix_chkpwd /sbin/unix_chkpwd /usr/bin/chage /usr/bin/expiry"
    - "-chmod 0640 /etc/shadow /etc/gshadow"
    - "-chmod 2755 /usr/sbin/unix_chkpwd /sbin/unix_chkpwd /usr/bin/chage /usr/bin/expiry"
    - "-chmod 0755 /etc/polkit-1 /etc/polkit-1/rules.d"
    - "-touch /etc/axisos-installed"
    - "-sh -c 'if [ -x /usr/sbin/update-grub ] && [ -d /boot/grub ]; then update-grub || true; fi'"
