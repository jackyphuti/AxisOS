# ==============================================================================
# AxisOS Gaming & Development Performance Tuning Drop-In
# Critical for Steam Proton (ESync, FSync), RPCS3, PCSX2, Clang/GCC parallel compilation
# ==============================================================================

# Memory mapping headroom for high-end games (Steam / Proton / Wine / ESync)
vm.max_map_count = 2147483642

# File descriptors and file watches for modern IDEs, build systems, and game assets
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 8192

# Virtual memory paging & dirty cache flushing (prevents micro-stutters during disk I/O)
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.compaction_proactiveness = 0
vm.page-cluster = 0
vm.watermark_scale_factor = 125
vm.zone_reclaim_mode = 0

# Low-latency CFS task scheduling & autogrouping for desktop and gaming responsiveness
kernel.sched_autogroup_enabled = 1
kernel.sched_latency_ns = 6000000
kernel.sched_min_granularity_ns = 750000
kernel.sched_wakeup_granularity_ns = 1000000
kernel.sched_migration_cost_ns = 5000000
kernel.nmi_watchdog = 0

# High-speed TCP BBR congestion control & low-latency network buffers
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 8192

# Disable split-lock mitigation to prevent severe FPS drops in older game engines running on Wine
kernel.split_lock_mitigate = 0
